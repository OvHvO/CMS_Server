# =============================================================================
# BrightCare Medical Centre — Database Configuration
# =============================================================================
# IMPORTANT: Change these values to match your PostgreSQL setup before running.
# CONFIGURATION NOTES: Use application.dev.properties for development and testing or change from the databaseconfig file.
# This file is for example purposes and **DO NOT UPLOAD** to repository after changing the actual values.

# Database connection URL
db.url=jdbc:postgresql://localhost:5432/cms

# Database credentials
db.username=postgres
db.password=${DB_PASSWORD}

# ---- HikariCP Connection Pool Tuning ----
# Maximum number of connections in the pool
db.pool.maxSize=10

# Minimum number of idle connections
db.pool.minIdle=2

# Maximum wait time for a connection (ms)
db.pool.connectionTimeoutMs=30000

# Maximum time a connection may sit idle in the pool (ms)
db.pool.idleTimeoutMs=600000

# Maximum lifetime of a connection in the pool (ms)
db.pool.maxLifetimeMs=1800000

# Leak detection threshold — connections held longer than this log a warning (ms)
# Set to 0 to disable. Recommended: 60000 (1 minute) during development.
db.pool.leakDetectionThresholdMs=60000

# =============================================================================
# Authentication & Security Configuration
# =============================================================================

# Two-Factor Authentication (TOTP) Issuer name
auth.totp.issuer=Clinic Management System

# Session timeout in minutes
auth.session.timeoutMinutes=30

# TOTP time window for verification (number of windows to check before/after current time)
auth.totp.windowSize=1

# Enable audit logging for authentication events
auth.audit.enabled=true

# Log level for authentication (INFO, WARN, ERROR, DEBUG)
auth.audit.logLevel=INFO
